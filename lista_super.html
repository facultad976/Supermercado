<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista del Super</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f0eb; color: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
    .container { width: 100%; max-width: 520px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
    .header h1 { font-size: 20px; font-weight: 500; }
    .sync-bar { font-size: 12px; color: #888; margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #5a9e6f; display: inline-block; }
    .sync-dot.loading { background: #e0a030; animation: pulse 1s infinite; }
    .sync-dot.error { background: #c0392b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .stats { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    .stat { background: #fff; border-radius: 10px; padding: 10px 14px; flex: 1; text-align: center; border: 0.5px solid #ddd; }
    .stat-val { font-size: 22px; font-weight: 500; }
    .stat-lbl { font-size: 12px; color: #888; }
    .add-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .add-row input { flex: 1; padding: 9px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; background: #fff; }
    .add-row input:focus { border-color: #888; }
    .add-row select { width: 140px; padding: 9px 8px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 13px; outline: none; background: #fff; }
    .add-row button { padding: 9px 16px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; font-size: 18px; font-weight: 500; }
    .add-row button:hover { background: #f0f0ee; }
    .section-title { font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin: 1rem 0 6px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 0.5px solid #ddd; background: #fff; margin-bottom: 6px; transition: opacity 0.2s; }
    .item.done { opacity: 0.4; }
    .item.done .item-name { text-decoration: line-through; }
    .item-name { flex: 1; font-size: 15px; }
    .check-btn { background: none; border: 1.5px solid #bbb; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; transition: background 0.15s; }
    .check-btn.checked { background: #d4edda; border-color: #5a9e6f; color: #2e7d50; }
    .del-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 16px; padding: 0 2px; }
    .del-btn:hover { color: #c0392b; }
    .empty { text-align: center; color: #aaa; font-size: 14px; padding: 2.5rem 0; }
    .share-box { margin-top: 2rem; padding: 14px 16px; background: #fff; border: 0.5px solid #ddd; border-radius: 10px; }
    .share-box p { font-size: 13px; color: #555; margin-bottom: 8px; }
    .share-row { display: flex; gap: 8px; align-items: center; }
    .share-row input { flex: 1; font-size: 12px; padding: 6px 10px; border: 0.5px solid #ccc; border-radius: 6px; background: #f8f8f6; color: #444; outline: none; }
    .share-row button { padding: 6px 12px; font-size: 13px; border: 0.5px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    .share-row button:hover { background: #f0f0ee; }
    .copied-msg { font-size: 12px; color: #5a9e6f; margin-top: 6px; display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <span style="font-size:22px">🛒</span>
    <h1>Lista del super</h1>
  </div>

  <div class="sync-bar">
    <span class="sync-dot loading" id="sync-dot"></span>
    <span id="sync-label">Conectando...</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="total-count">0</div><div class="stat-lbl">total</div></div>
    <div class="stat"><div class="stat-val" id="done-count">0</div><div class="stat-lbl">comprados</div></div>
    <div class="stat"><div class="stat-val" id="left-count">0</div><div class="stat-lbl">faltan</div></div>
  </div>

  <div class="add-row">
    <input type="text" id="new-item" placeholder="Agregar producto..." />
    <select id="new-cat">
      <option value="verduleria">🥦 Verdulería</option>
      <option value="lacteos">🥛 Lácteos</option>
      <option value="carnes">🥩 Carnes</option>
      <option value="panaderia">🍞 Panadería</option>
      <option value="bebidas">🧃 Bebidas</option>
      <option value="limpieza">🧹 Limpieza</option>
      <option value="otros" selected>📦 Otros</option>
    </select>
    <button onclick="addItem()">+</button>
  </div>

  <div id="list-container"><div class="empty">Tu lista está vacía. Agregá productos arriba.</div></div>

  <div class="share-box">
    <p>📤 Compartí este link para que otra persona vea y tache productos en tiempo real:</p>
    <div class="share-row">
      <input type="text" id="share-url" readonly value="" />
      <button onclick="copyLink()">Copiar link</button>
    </div>
    <div class="copied-msg" id="copied-msg">✓ Link copiado</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrojol0UnyvWVXbrxj6IJsLsN8IoQlu8M",
    authDomain: "supermercado-88ae9.firebaseapp.com",
    databaseURL: "https://supermercado-88ae9-default-rtdb.firebaseio.com",
    projectId: "supermercado-88ae9",
    storageBucket: "supermercado-88ae9.firebasestorage.app",
    messagingSenderId: "97876761557",
    appId: "1:97876761557:web:e5545063f810b304a67b5c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const listaRef = ref(db, 'lista');

  const CATS_ORDER = ['verduleria','lacteos','carnes','panaderia','bebidas','limpieza','otros'];
  const EMOJIS = { verduleria:'🥦', lacteos:'🥛', carnes:'🥩', panaderia:'🍞', bebidas:'🧃', limpieza:'🧹', otros:'📦' };

  let items = {};

  // Escuchar cambios en tiempo real
  onValue(listaRef, (snapshot) => {
    items = snapshot.val() || {};
    render();
    setSyncStatus('ok', 'Sincronizado ✓');
  }, (error) => {
    setSyncStatus('error', 'Error de conexión');
  });

  function setSyncStatus(type, msg) {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    dot.className = 'sync-dot' + (type !== 'ok' ? ' ' + type : '');
    lbl.textContent = msg;
  }

  window.addItem = function() {
    const inp = document.getElementById('new-item');
    const cat = document.getElementById('new-cat').value;
    const name = inp.value.trim();
    if (!name) return;
    const id = Date.now().toString();
    const itemRef = ref(db, 'lista/' + id);
    set(itemRef, { id, name, cat, done: false });
    inp.value = '';
    inp.focus();
  };

  document.getElementById('new-item').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.addItem();
  });

  window.toggle = function(id) {
    const it = items[id];
    if (!it) return;
    const itemRef = ref(db, 'lista/' + id);
    set(itemRef, { ...it, done: !it.done });
  };

  window.removeItem = function(id) {
    const itemRef = ref(db, 'lista/' + id);
    remove(itemRef);
  };

  function render() {
    const container = document.getElementById('list-container');
    const arr = Object.values(items);
    const total = arr.length;
    const done = arr.filter(i => i.done).length;
    document.getElementById('total-count').textContent = total;
    document.getElementById('done-count').textContent = done;
    document.getElementById('left-count').textContent = total - done;

    if (total === 0) {
      container.innerHTML = '<div class="empty">Tu lista está vacía. Agregá productos arriba.</div>';
      return;
    }

    const groups = {};
    arr.forEach(it => {
      if (!groups[it.cat]) groups[it.cat] = [];
      groups[it.cat].push(it);
    });

    let html = '';
    CATS_ORDER.forEach(cat => {
      if (!groups[cat]) return;
      html += `<div class="section-title">${EMOJIS[cat]} ${cat}</div>`;
      groups[cat].forEach(it => {
        html += `
          <div class="item${it.done ? ' done' : ''}">
            <button class="check-btn${it.done ? ' checked' : ''}" onclick="toggle('${it.id}')">${it.done ? '✓' : ''}</button>
            <span class="item-name">${it.name}</span>
            <button class="del-btn" onclick="removeItem('${it.id}')">🗑</button>
          </div>`;
      });
    });
    container.innerHTML = html;
  }

  window.copyLink = function() {
    const url = document.getElementById('share-url').value;
    navigator.clipboard.writeText(url).then(() => {
      const msg = document.getElementById('copied-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2500);
    });
  };

  document.getElementById('share-url').value = location.href;
</script>
</body>
</html>
